<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hors connexion · KABA</title>
    <link rel="icon" type="image/png" href="/images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --brand:#7C3AED; --brand-dark:#6D28D9; --dark:#1A1523; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Poppins',system-ui,sans-serif;
            min-height:100vh; display:flex; align-items:center; justify-content:center;
            background:radial-gradient(1200px 600px at 50% -10%, #F3EEFF 0%, #ffffff 55%);
            color:var(--dark); padding:24px; text-align:center;
        }
        .card { max-width:460px; }
        .logo { display:inline-flex; align-items:center; gap:10px; margin-bottom:36px; text-decoration:none; }
        .logo img { height:36px; }
        .logo span { font-weight:900; font-size:26px; letter-spacing:-1px; color:var(--dark); }
        .icon {
            width:88px; height:88px; border-radius:26px; margin:0 auto 26px;
            display:flex; align-items:center; justify-content:center; font-size:38px; color:#fff;
            background:linear-gradient(135deg, var(--brand), var(--brand-dark));
            box-shadow:0 20px 40px -12px rgba(124,58,237,.45);
        }
        h1 { font-size:26px; font-weight:800; margin-bottom:12px; letter-spacing:-.5px; }
        p { font-size:15px; color:#6B7280; line-height:1.6; margin-bottom:28px; }
        button {
            font-family:inherit; font-size:15px; font-weight:700; cursor:pointer;
            display:inline-flex; align-items:center; gap:8px; height:50px; padding:0 26px;
            border-radius:999px; border:none; background:var(--brand); color:#fff;
            box-shadow:0 12px 24px -8px rgba(124,58,237,.5); transition:.15s;
        }
        button:hover { background:var(--brand-dark); transform:translateY(-1px); }
        .hint { font-size:13px; color:#9CA3AF; margin-top:22px; }
    </style>
</head>
<body>
    <div class="card">
        <a href="/" class="logo">
            <img src="/images/logo-trans.png" alt="KABA">
            <span>KABA</span>
        </a>
        <div class="icon">📡</div>
        <h1>Vous êtes hors connexion</h1>
        <p>
            Impossible de joindre KABA pour le moment. Vérifiez votre connexion internet,
            puis réessayez. Les pages déjà consultées restent accessibles.
        </p>
        <button onclick="location.reload()">Réessayer</button>
        <p class="hint">La connexion revient ? Cette page se rechargera toute seule.</p>
    </div>

    <script>
        // Recharge automatiquement dès que le réseau revient.
        window.addEventListener('online', () => location.reload());
    </script>
</body>
</html>
