<svg xmlns="http://www.w3.org/2000/svg" width="600" height="80" viewBox="0 0 600 80" preserveAspectRatio="none">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9a86c"/>
      <stop offset="0.35" stop-color="#c08a4b"/>
      <stop offset="0.7" stop-color="#9c6a35"/>
      <stop offset="1" stop-color="#6f4620"/>
    </linearGradient>
    <!-- Veines du bois : bruit fractal étiré horizontalement -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015 0.75" numOctaves="4" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values="0 0 0 0 0.28
                0 0 0 0 0.17
                0 0 0 0 0.07
                0 0 0 0.6 0" result="grain"/>
    </filter>
  </defs>
  <rect width="600" height="80" fill="url(#base)"/>
  <rect width="600" height="80" filter="url(#grain)" opacity="0.45"/>
  <!-- Reflet doux en haut -->
  <rect width="600" height="14" fill="#ffffff" opacity="0.10"/>
  <!-- Ombre au bas de la planche -->
  <rect y="66" width="600" height="14" fill="#3a2210" opacity="0.35"/>
</svg>
