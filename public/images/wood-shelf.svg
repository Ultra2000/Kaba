<svg xmlns="http://www.w3.org/2000/svg" width="600" height="80" viewBox="0 0 600 80" preserveAspectRatio="none">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efdcbb"/>
      <stop offset="0.35" stop-color="#e6cfa6"/>
      <stop offset="0.7" stop-color="#d8bd8c"/>
      <stop offset="1" stop-color="#c6a878"/>
    </linearGradient>

    <!-- Veines fines -->
    <filter id="grainFine" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.55" numOctaves="5" seed="8" result="n"/>
      <feComponentTransfer in="n" result="c">
        <feFuncA type="gamma" amplitude="1.3" exponent="3" offset="0"/>
      </feComponentTransfer>
      <feColorMatrix in="c" type="matrix"
        values="0 0 0 0 0.55
                0 0 0 0 0.42
                0 0 0 0 0.26
                0 0 0 1 0"/>
    </filter>

    <!-- Veines larges (grandes ondes du bois) -->
    <filter id="grainWide" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.14" numOctaves="3" seed="3" result="n"/>
      <feComponentTransfer in="n" result="c">
        <feFuncA type="gamma" amplitude="1.2" exponent="2.4" offset="0"/>
      </feComponentTransfer>
      <feColorMatrix in="c" type="matrix"
        values="0 0 0 0 0.60
                0 0 0 0 0.47
                0 0 0 0 0.30
                0 0 0 1 0"/>
    </filter>
  </defs>

  <rect width="600" height="80" fill="url(#base)"/>
  <rect width="600" height="80" filter="url(#grainWide)" opacity="0.4"/>
  <rect width="600" height="80" filter="url(#grainFine)" opacity="0.55"/>
  <!-- Reflet doux en haut -->
  <rect width="600" height="12" fill="#ffffff" opacity="0.18"/>
  <!-- Ombre au bas de la planche -->
  <rect y="68" width="600" height="12" fill="#9c7c4e" opacity="0.35"/>
</svg>
